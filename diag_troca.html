<!doctype html><meta charset="utf-8"><title>diag troca</title>
<pre id="o" style="font:13px monospace;padding:10px">rodando...</pre>
<iframe id="f" style="width:1000px;height:600px;border:1px solid #888"></iframe>
<script>
const L=[];const log=t=>{L.push(t);document.getElementById('o').textContent=L.join('\n')};
const f=document.getElementById('f');
f.src='index.html?cb='+Date.now()+'&cena='+encodeURIComponent('PT SC- FACH053');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
// hash simples do conteudo de pixels que o portal esta mostrando
function hash(w){
  try{const c=w.document.querySelector('canvas');
    const g=c.getContext('2d').getImageData(0,0,c.width,c.height).data;let h=0;
    for(let i=0;i<g.length;i+=397)h=(h*31+g[i])|0;return h}catch(e){return 'erro '+e.message}
}
(async()=>{
  await sleep(11000); const w=f.contentWindow;
  log('abriu: cabecalho='+w.document.getElementById('nomeScan').textContent+' | hash tela='+hash(w));
  await w.abrePano('PT SC- FACH044'); await sleep(2500);
  log('apos abrePano(FACH044): cabecalho='+w.document.getElementById('nomeScan').textContent+' | hash tela='+hash(w)+' | W='+w.eval('W')+' | CENA='+w.eval('CENA&&CENA.nome'));
  await w.abrePano('PT SC- FACH053'); await sleep(2500);
  log('volta FACH053: hash tela='+hash(w));
})();
</script>

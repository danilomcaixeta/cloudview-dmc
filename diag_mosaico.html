<!doctype html><html><head><meta charset="utf-8"><title>diag</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>body{font:13px monospace;margin:0}#log{padding:8px;white-space:pre-wrap}#mapa{height:300px}</style></head>
<body><div id="log">carregando...</div><div id="mapa"></div>
<script>
const R2='https://pub-4124c0d235a343278f1e6c5bbdb2c539.r2.dev/dcm/gyn-shop/';
const L2=[];const log=(...a)=>{L2.push(a.join(' '));document.getElementById('log').textContent=L2.join('\n')};
(async()=>{
 try{
  const G=await (await fetch('setups_v2.json?t='+Date.now())).json();
  const S=G.setups.filter(s=>s.lat&&typeof s.E==='number');
  log('setups com lat/lon:',S.length);
  const n=S.length; let SE=0,SN=0,SEE=0,SNN=0,SEN=0,SL=0,SLO=0,SEL=0,SNL=0,SELO=0,SNLO=0;
  for(const s of S){const E=s.E-680000,N=s.N-8150000,la=s.lat,lo=s.lon;
    SE+=E;SN+=N;SEE+=E*E;SNN+=N*N;SEN+=E*N;SL+=la;SLO+=lo;SEL+=E*la;SNL+=N*la;SELO+=E*lo;SNLO+=N*lo;}
  const solve=(s0,s1,s2)=>{const M=[[n,SE,SN,s0],[SE,SEE,SEN,s1],[SN,SEN,SNN,s2]];
    for(let i=0;i<3;i++){let p=i;for(let r=i+1;r<3;r++)if(Math.abs(M[r][i])>Math.abs(M[p][i]))p=r;[M[i],M[p]]=[M[p],M[i]];
      for(let r=0;r<3;r++){if(r===i)continue;const f=M[r][i]/M[i][i];for(let c=i;c<4;c++)M[r][c]-=f*M[i][c];}}
    return [M[0][3]/M[0][0],M[1][3]/M[1][1],M[2][3]/M[2][2]];};
  const A=solve(SL,SEL,SNL),B=solve(SLO,SELO,SNLO);
  const conv=(E,N)=>{const e=E-680000,nn=N-8150000;return [A[0]+A[1]*e+A[2]*nn,B[0]+B[1]*e+B[2]*nn]};
  const M=await (await fetch(R2+'mosaico/mosaicos.json?t='+Date.now())).json();
  log('pisos no mosaicos.json:',Object.keys(M).join(', '));
  const k='Fachada',m=M[k];
  const no=conv(m.E0,m.N1),se=conv(m.E1,m.N0);
  log('mosaico Fachada E0 E1 N0 N1:',m.E0,m.E1,m.N0,m.N1);
  log('canto NO:',no[0].toFixed(6),no[1].toFixed(6),' canto SE:',se[0].toFixed(6),se[1].toFixed(6));
  const f=S.filter(s=>s.piso==='Fachada');
  const las=f.map(s=>s.lat),los=f.map(s=>s.lon);
  log('setups Fachada lat',Math.min(...las).toFixed(6),'a',Math.max(...las).toFixed(6),'| lon',Math.min(...los).toFixed(6),'a',Math.max(...los).toFixed(6));
  // erro medio da calibracao
  let erro=0; for(const s of f){const p=conv(s.E,s.N);erro+=Math.hypot((p[0]-s.lat)*111320,(p[1]-s.lon)*111320*Math.cos(s.lat*Math.PI/180))}
  log('erro medio da conversao nos setups Fachada:',(erro/f.length).toFixed(2),'m');
  const mp=L.map('mapa').setView([no[0],no[1]],18);
  L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',{maxZoom:20,subdomains:'0123'}).addTo(mp);
  const url=R2+'mosaico/'+m.arq;
  const io=L.imageOverlay(url,[[no[0],no[1]],[se[0],se[1]]],{opacity:0.95}).addTo(mp);
  io.on('load',()=>log('IMAGEM CARREGOU:',m.arq));
  io.on('error',()=>log('IMAGEM FALHOU:',url));
  mp.fitBounds([[no[0],no[1]],[se[0],se[1]]]);
  const t=await fetch(url);log('fetch da imagem:',t.status,t.headers.get('content-type'));
 }catch(e){log('ERRO: '+e.message)}
})();
</script></body></html>

<!doctype html><meta charset="utf-8"><title>diag</title>
<body style="font:13px monospace;padding:12px;background:#fff">
<div id="out">testando...</div>
<script>
const R2BASE='https://pub-4124c0d235a343278f1e6c5bbdb2c539.r2.dev/dcm/gyn-shop/';
const arq=p=>R2BASE+p.split('/').map(encodeURIComponent).join('/');
const log=m=>document.getElementById('out').insertAdjacentHTML('beforeend','<div>'+m+'</div>');
const NOME='G2DOCA- G2DOCA035';
async function t(rot,url,opts){
  const t0=performance.now();
  try{const r=await fetch(url,opts); const b=await r.blob();
    log(rot+': OK '+r.status+' '+Math.round(b.size/1024)+'KB em '+Math.round(performance.now()-t0)+'ms');
    return true;
  }catch(e){log(rot+': FALHOU '+e.name+' ('+Math.round(performance.now()-t0)+'ms)');return false;}
}
(async()=>{
 await t('thumb 22KB', arq('thumbs/'+NOME+'.jpg'));
 await t('json grade', arq('dados/'+NOME+'.json'));
 await t('bin grade 1.4MB', arq('dados/'+NOME+'.bin.gz'));
 await t('pano 3.5MB', arq('panos/'+NOME+'.jpg'));
 await t('pano no-cors', arq('panos/'+NOME+'.jpg'), {mode:'no-cors'});
 const im=new Image(); im.crossOrigin='anonymous'; im.src=arq('panos/'+NOME+'.jpg');
 await new Promise(r=>{im.onload=r;im.onerror=r;setTimeout(r,15000)});
 log('Image tag: '+(im.naturalWidth?im.naturalWidth+'x'+im.naturalHeight+' ok':'ERRO'));
})();
</script>

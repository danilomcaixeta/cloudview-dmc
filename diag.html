<!doctype html><meta charset="utf-8"><title>diag</title>
<body style="font:13px monospace;padding:12px;background:#fff">
<div id="out">testando...</div>
<script>
const R2BASE='https://pub-4124c0d235a343278f1e6c5bbdb2c539.r2.dev/dcm/gyn-shop/';
const arq=p=>R2BASE+p.split('/').map(encodeURIComponent).join('/');
const log=m=>document.getElementById('out').insertAdjacentHTML('beforeend','<div>'+m+'</div>');
const NOME='G2DOCA- G2DOCA035';
async function t(rot,url,opts){
  const t0=performance.now();
  try{const r=await fetch(url,opts); const b=await r.blob();
    log(rot+': OK '+r.status+' '+Math.round(b.size/1024)+'KB '+(r.headers.get('access-control-allow-origin')||'-'));
  }catch(e){log(rot+': FALHOU '+e.name+' ('+Math.round(performance.now()-t0)+'ms)');}
}
(async()=>{
 await t('pano (url igual)', arq('panos/'+NOME+'.jpg'));
 await t('pano ?v=2', arq('panos/'+NOME+'.jpg')+'?v=2');
 await t('pano cache reload', arq('panos/'+NOME+'.jpg')+'?v=3', {cache:'reload'});
 await t('json ?v=2', arq('dados/'+NOME+'.json')+'?v=2');
 await t('json sem espaco (teste)', R2BASE+'setups.json?x=1');
 await t('thumb ?v=2', arq('thumbs/'+NOME+'.jpg')+'?v=2');
})();
</script>
